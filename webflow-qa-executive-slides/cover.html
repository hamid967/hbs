<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;box-sizing:border-box} .slide-container{width:1280px;min-height:720px;background:#f7f5ed;color:#123d31;font-family:Tahoma,Arial,sans-serif;display:flex;direction:rtl;overflow:hidden}.title-area{width:62%;padding:105px 90px 0 40px;position:relative}.eyebrow{font-size:19px;letter-spacing:.5px;color:#8a6a27;margin-bottom:34px;font-weight:700}.title{font-size:66px;line-height:1.22;font-weight:800;max-width:680px}.subtitle{font-size:27px;line-height:1.65;color:#4d625a;margin-top:28px;max-width:620px}.audience{display:inline-block;margin-top:55px;border-top:2px solid #c7a450;padding-top:16px;font-size:20px;color:#5f6d66}.art{width:38%;background:#164d3c;position:relative;overflow:hidden}.circle{position:absolute;border:2px solid rgba(255,255,255,.26);border-radius:50%}.c1{width:450px;height:450px;top:100px;right:-210px}.c2{width:300px;height:300px;top:210px;right:38px}.c3{width:120px;height:120px;top:90px;right:128px;background:#c7a450;border:0}.line{position:absolute;width:420px;height:2px;background:#c7a450;top:490px;right:-60px;transform:rotate(-32deg)}.badge{position:absolute;bottom:72px;right:70px;color:#f7f5ed;font-size:24px;font-weight:700}.badge span{color:#d9bd77}.dot{position:absolute;width:18px;height:18px;background:#c7a450;bottom:77px;right:42px;border-radius:50%}
</style>
</head>
<body>
<div class="slide-container">
  <section class="title-area">
    <div class="eyebrow">حلول الغد | WEBFLOW QA</div>
    <div class="title">ضمان الجودة<br>قبل الإطلاق</div>
    <div class="subtitle">خطة تشغيلية لحماية التحويل والثقة والخصوصية في الموقع التسويقي.</div>
    <div class="audience">موجّه لفريق التطوير والإدارة والتسويق</div>
  </section>
  <aside class="art"><div class="circle c1"></div><div class="circle c2"></div><div class="circle c3"></div><div class="line"></div><div class="dot"></div><div class="badge">WEBFLOW <span>QA</span></div></aside>
</div>
</body>
</html>
