name: HBS Verification

on:
  push:
    branches: [main, audit/frappe-hrms-integration]
  pull_request:
    branches: [main, audit/frappe-hrms-integration]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/hrhbs_ci
      HRHBS_ADMIN_EMAIL: ci-admin@example.invalid
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for E2E
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify HBS
        run: pnpm check && pnpm test && pnpm build
      - name: Verify auth gate and UI hooks
        run: pnpm test:e2e
