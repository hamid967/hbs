# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will install Deno then run `deno lint` and `deno test`.
# For more information see: https://github.com/denoland/setup-deno

name: Deno

on:
  push:
    branches: ["main"]
    paths:
      - "deno/**"
      - ".github/workflows/deno.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "deno/**"
      - ".github/workflows/deno.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Deno
        # uses: denoland/setup-deno@v1
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31  # v1.1.2
        with:
          deno-version: v1.x

      - name: Run Deno linter on Deno sources only
        shell: bash
        run: |
          mapfile -t deno_sources < <(find deno -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' -o -name '*.jsx' \) -print 2>/dev/null || true)
          if [ "${#deno_sources[@]}" -eq 0 ]; then
            echo "No Deno source files found; Node/TypeScript sources are intentionally verified by the Node CI workflow."
            exit 0
          fi
          deno lint "${deno_sources[@]}"

      - name: Run Deno tests on Deno sources only
        shell: bash
        run: |
          mapfile -t deno_tests < <(find deno -type f \( -name '*_test.ts' -o -name '*.test.ts' -o -name '*_test.tsx' -o -name '*.test.tsx' \) -print 2>/dev/null || true)
          if [ "${#deno_tests[@]}" -eq 0 ]; then
            echo "No Deno tests found; Node/TypeScript tests are intentionally verified by the Node CI workflow."
            exit 0
          fi
          deno test -A "${deno_tests[@]}"
