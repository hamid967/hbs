<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}.slide-container{width:1280px;min-height:720px;background:#f7f5ee;color:#153f32;font-family:Arial,"Tahoma",sans-serif;position:relative;display:flex;direction:rtl}.content{width:63%;padding:92px 86px 64px 20px;display:flex;flex-direction:column;justify-content:center}.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:#4b806b;letter-spacing:.3px}.dot{width:10px;height:10px;background:#b9924a;border-radius:50%;display:inline-block}.title{font-size:60px;line-height:1.25;font-weight:800;max-width:680px;margin-top:22px}.title span{color:#4d8c73}.rule{width:128px;height:5px;background:#b9924a;margin:28px 0}.subtitle{font-size:23px;line-height:1.75;color:#53655d;max-width:620px}.meta{margin-top:46px;display:flex;gap:34px;font-size:16px;color:#53655d}.meta strong{color:#153f32}.visual{width:37%;background:#173f32;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.orb{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.23)}.orb.one{width:420px;height:420px;top:-120px;left:-115px}.orb.two{width:280px;height:280px;bottom:-80px;right:-80px}.grid{position:relative;width:270px;height:270px}.tile{position:absolute;background:#f7f5ee;border-radius:8px}.t1{width:128px;height:128px;right:0;top:0}.t2{width:128px;height:128px;left:0;bottom:0;background:#b9924a}.t3{width:108px;height:108px;right:18px;bottom:18px;background:#4d8c73}.t4{width:78px;height:78px;left:28px;top:28px;background:#dce8df}.tile-label{position:absolute;right:22px;top:20px;color:#173f32;font-size:13px;font-weight:bold}.tile-num{position:absolute;right:22px;bottom:18px;color:#173f32;font-size:39px;font-weight:800}.side-label{position:absolute;bottom:52px;right:58px;color:#dce8df;font-size:15px;letter-spacing:1px}.corner{position:absolute;top:46px;right:54px;border:1px solid rgba(255,255,255,.4);color:#fff;padding:10px 14px;border-radius:20px;font-size:13px}
</style>
</head>
<body>
<div class="slide-container">
  <section class="content">
    <div class="eyebrow"><span class="dot"></span> خطة تنفيذية للإدارة العليا</div>
    <h1 class="title">حلول الغد على <span>Webflow</span></h1>
    <div class="rule"></div>
    <p class="subtitle">خطة الموقع التسويقي، نموذج الميزانية، الجدول التنفيذي، وضوابط الإطلاق القابل للقياس.</p>
    <div class="meta"><span><strong>النطاق:</strong> موقع تسويقي مستقل</span><span><strong>المنهج:</strong> تنفيذ منضبط</span></div>
  </section>
  <aside class="visual">
    <div class="corner">HR HBS</div><div class="orb one"></div><div class="orb two"></div>
    <div class="grid"><div class="tile t1"><span class="tile-label">خطة</span><span class="tile-num">01</span></div><div class="tile t2"></div><div class="tile t3"></div><div class="tile t4"></div></div>
    <div class="side-label">النطاق · التكلفة · الإطلاق</div>
  </aside>
</div>
</body>
</html>
