<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}.slide-container{width:1280px;min-height:720px;background:#153f32;color:#fff;font-family:Arial,"Tahoma",sans-serif;direction:rtl;position:relative;display:flex;overflow:hidden}.content{width:68%;padding:105px 88px 0 20px;position:relative;z-index:2}.eyebrow{font-size:15px;color:#e8d3a2;font-weight:bold;letter-spacing:.4px}.title{font-size:59px;line-height:1.28;margin-top:22px;font-weight:800}.title span{color:#b9dcc9}.rule{width:126px;height:5px;background:#b9924a;margin:28px 0}.statement{font-size:23px;line-height:1.7;color:#dce8df;max-width:680px}.decision{margin-top:44px;display:flex;gap:0;border-top:1px solid rgba(255,255,255,.28);width:670px}.item{width:33%;padding-top:18px;padding-left:20px;font-size:15px;color:#dce8df}.item strong{display:block;font-size:20px;color:#fff;margin-bottom:8px}.visual{width:32%;position:relative;display:flex;align-items:center;justify-content:center}.ring{position:absolute;width:420px;height:420px;border:1px solid rgba(255,255,255,.18);border-radius:50%;right:-150px;top:-120px}.square{position:absolute}.a{width:180px;height:180px;background:#b9924a;top:152px;left:62px}.b{width:126px;height:126px;background:#e7f0ea;top:206px;left:116px}.c{width:86px;height:86px;background:#4d8c73;top:260px;left:170px}.footer{position:absolute;bottom:46px;right:88px;font-size:14px;color:#a8c7b5}
</style>
</head>
<body>
<div class="slide-container">
 <section class="content">
  <div class="eyebrow">خلاصة تنفيذية</div>
  <h1 class="title">بداية منضبطة،<br><span>إطلاق قابل للقياس</span></h1>
  <div class="rule"></div>
  <p class="statement">خطة Webflow تنجح عندما يثبت النطاق، يتحدد المالك، وتُعتمد نقطة التحويل قبل بدء البناء.</p>
  <div class="decision"><div class="item"><strong>01</strong>اعتماد النطاق</div><div class="item"><strong>02</strong>تعيين الملاك</div><div class="item"><strong>03</strong>تحديد التحويل</div></div>
 </section>
 <aside class="visual"><div class="ring"></div><div class="square a"></div><div class="square b"></div><div class="square c"></div></aside>
 <div class="footer">حلول الغد | HR HBS · خطة Webflow التنفيذية</div>
</div>
</body>
</html>
